name: Feature request
description: Suggest an improvement for m2A Eau
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: What would you like the integration to do?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior or UI.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include credentials, tokens, cookies or personal data.
          required: true
